name: Build Jelly's Journey — Godot 4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      - name: Import project assets
        run: godot --headless --path . --editor --quit
      - name: Build Godot web release
        run: |
          NODE_BIN="$(command -v node || true)"
          if [ -z "$NODE_BIN" ]; then NODE_BIN=/__e/node24/bin/node; fi
          GODOT_BIN=godot "$NODE_BIN" tools/build-godot.mjs
      - name: Verify exported game
        run: |
          test -s dist/index.html
          test -s dist/index.wasm.part0
          test -s dist/index.wasm.part1
          test -s dist/index.wasm.part2
          test ! -e dist/index.wasm
          test -s dist/index.pck
      - name: Upload tested web build
        uses: actions/upload-artifact@v4
        with:
          name: jellys-journey-web
          path: dist
