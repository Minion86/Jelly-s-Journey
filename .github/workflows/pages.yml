name: Build and deploy Jelly's Journey — Godot 4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import project assets
        run: godot --headless --path . --editor --quit
      - name: Build Godot web release
        run: |
          rm -rf dist
          mkdir -p dist
          godot --headless --path . --export-release "Web" dist/index.html
      - name: Verify exported game
        run: |
          test -s dist/index.html
          test -s dist/index.wasm
          test -s dist/index.pck
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
